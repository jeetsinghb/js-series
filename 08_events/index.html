<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>

<body>
    <h1>Events</h1>
    <button id="stop">STOP</button>
</body>

<script>
    // Method 1:

    // setTimeout(function () {
    //     console.log('Hello World');
    // }, 2000)

    // Method 2:

    const printText = function () {
        console.log('Hello World');
    }

    const newText = function () {
        document.querySelector('h1').innerHTML = "This is a title";
    }

    setTimeout(printText, 2000) // pass the fn reference

    const changeText = setTimeout(newText, 2000)

    // Clear Timeout

    const btn = document.querySelector('#stop').addEventListener('click', function () {
        clearTimeout(changeText);
        console.log('STOPPED');
    });

</script>

</html>
